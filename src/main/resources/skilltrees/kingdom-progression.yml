# Every .yml file in this directory becomes one tab in the skill-tree screen.
skilltree: global
priority: 0
name: Kingdom Progression
gname: Königreichsfortschritt
icon: minecraft:golden_helmet

skills:
  - id: long_live_the_king
    name: Long Live The King
    gname: Lang Lebe Der König
    description: Every player gains a heart
    beschreibung: Alle Spieler erhalten ein halbes Herz
    icon: minecraft:golden_helmet
    previous: none
    following: 0
    costs:
      kingdom_points: 0
    stats:
      - addHealth(2)

  - id: frontier_charter
    name: Frontier Charter
    gname: Grenzland-Charta
    description: Establish the realm's frontier program and increase Veil Level by 1.
    beschreibung: Gründe das Grenzlandprogramm des Reiches und erhöhe die Schleierstufe um 1.
    icon: minecraft:recovery_compass
    previous: long_live_the_king
    following: 0
    costs:
      kingdom_points: 25
      fakhrul_currency: 3
    stats:
      - addVeilLevel(1)

  - id: wardstone_network
    name: Wardstone Network
    gname: Schutzstein-Netzwerk
    description: Anchor new wardstones across the frontier and increase Veil Level by 1.
    beschreibung: Verankere neue Schutzsteine im Grenzland und erhöhe die Schleierstufe um 1.
    icon: minecraft:crying_obsidian
    previous: frontier_charter
    following: 0
    costs:
      kingdom_points: 45
      fakhrul_currency: 6
    stats:
      - addVeilLevel(1)

  - id: royal_granaries
    name: Royal Granaries
    gname: Königliche Kornspeicher
    description: Improve harvest yields by 10%.
    beschreibung: Erhöhe Ernteerträge um 10%.
    icon: minecraft:hay_block
    previous: frontier_charter
    following: 0
    costs:
      kingdom_points: 40
      fakhrul_currency: 5
    stats:
      - addFarmingMultiplier(10)

  - id: frontier_drills
    name: Frontier Drills
    gname: Grenzland-Manöver
    description: Every player gains half a heart and 5% attack speed.
    beschreibung: Alle Spieler erhalten ein halbes Herz und 5% Angriffsgeschwindigkeit.
    icon: minecraft:iron_sword
    previous: frontier_charter
    following: 0
    costs:
      kingdom_points: 40
      fakhrul_currency: 5
    stats:
      - addHealth(1)
      - addAttackSpeed(5)

  - id: strengthened_veil
    name: Strengthened Veil
    gname: Gestärkter Schleier
    description: Increase Veil Level by 1 and block interaction range by half a block.
    beschreibung: Erhöhe die Schleierstufe um 1 und die Blockreichweite um einen halben Block.
    icon: minecraft:respawn_anchor
    previous:
      - wardstone_network
      - frontier_drills
    following: 0
    costs:
      kingdom_points: 75
      fakhrul_currency: 9
    stats:
      - addVeilLevel(1)
      - addBlockInteractionRange(0.5)

  - id: thriving_realm
    name: Thriving Realm
    gname: Blühendes Reich
    description: Gain 5% mining speed, mob drops, and experience across the realm.
    beschreibung: Erhalte im gesamten Reich 5% mehr Abbaugeschwindigkeit, Mob-Beute und Erfahrung.
    icon: minecraft:emerald_block
    previous:
      - royal_granaries
      - frontier_drills
    following: 0
    costs:
      kingdom_points: 70
      fakhrul_currency: 8
    stats:
      - addMiningSpeed(5)
      - addMobDropMultiplier(5)
      - addExperienceMultiplier(5)

  - id: crown_beyond_the_veil
    name: Crown Beyond the Veil
    gname: Krone jenseits des Schleiers
    description: Unite every frontier effort, increase Veil Level by 1, and grant half a heart and 3% movement speed.
    beschreibung: Vereine alle Grenzlandprojekte, erhöhe die Schleierstufe um 1 und gewähre ein halbes Herz sowie 3% Bewegungsgeschwindigkeit.
    icon: minecraft:nether_star
    previous:
      - strengthened_veil
      - thriving_realm
    following: 0
    costs:
      kingdom_points: 125
      fakhrul_currency: 15
    stats:
      - addVeilLevel(1)
      - addHealth(1)
      - addMovementSpeed(3)
