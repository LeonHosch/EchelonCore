# Test tree for every proficiency: free, each node adds one rank. Everyone starts at Novice (1), so four nodes
# per proficiency reach Master (5): Apprentice, Journeyman, Expert, Master.
skilltree: personal
priority: 10
name: Proficiencies
gname: Fertigkeiten
icon: minecraft:writable_book

skills:
  # Cooking
  - id: cooking_apprentice
    name: Apprentice Cook
    gname: Kochlehrling
    description: Cooking Proficiency Apprentice
    beschreibung: Kochkunst Lehrling
    icon: minecraft:bowl
    previous: none
    following: 0
    stats:
      - addCookingLevel(1)

  - id: cooking_journeyman
    name: Journeyman Cook
    gname: Kochgeselle
    description: Cooking Proficiency Journeyman
    beschreibung: Kochkunst Geselle
    icon: minecraft:smoker
    previous: cooking_apprentice
    following: 0
    stats:
      - addCookingLevel(1)

  - id: cooking_expert
    name: Expert Cook
    gname: Kochexperte
    description: Cooking Proficiency Expert
    beschreibung: Kochkunst Experte
    icon: minecraft:cauldron
    previous: cooking_journeyman
    following: 0
    stats:
      - addCookingLevel(1)

  - id: cooking_master
    name: Master Cook
    gname: Kochmeister
    description: Cooking Proficiency Master
    beschreibung: Kochkunst Meister
    icon: minecraft:rabbit_stew
    previous: cooking_expert
    following: 0
    stats:
      - addCookingLevel(1)

